# Следит за выходом новых версий @vkontakte/icons, перегенерирует иконки и публикует библиотеку в npm.
# Также публикует версию из package.json, если её ещё нет в npm (ручные патчи).
name: Sync @vkontakte/icons

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: sync-icons
  cancel-in-progress: false

permissions:
  contents: write
  # Нужен для npm Trusted Publishing (OIDC) и provenance.
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Trusted Publishing требует npm >= 11.5.1, он идёт в комплекте с Node 24.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check versions
        id: check
        run: |
          current=$(node -p "require('./package.json').devDependencies['@vkontakte/icons']")
          latest=$(npm view @vkontakte/icons version)
          echo "@vkontakte/icons: current=$current, latest=$latest"
          version=$(node -p "require('./package.json').version")
          if [ "$current" != "$latest" ]; then
            # Мажорное обновление может ломать API, поэтому его выпускаем вручную.
            if [ "${current%%.*}" != "${latest%%.*}" ]; then
              echo "::error::Вышла мажорная версия @vkontakte/icons ($current -> $latest). Обновите библиотеку вручную."
              exit 1
            fi
            echo "icons=$latest" >> "$GITHUB_OUTPUT"
            # Версия библиотеки повторяет версию иконок.
            version=$latest
          fi
          if [ -n "$(npm view "vue-vkontakte-icons@$version" version 2>/dev/null)" ]; then
            echo "vue-vkontakte-icons@$version уже опубликована."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Update @vkontakte/icons
        if: steps.check.outputs.icons
        env:
          ICONS: ${{ steps.check.outputs.icons }}
        run: |
          npm install -D -E "@vkontakte/icons@$ICONS"
          npm version "$ICONS" --no-git-tag-version

      - name: Build
        if: steps.check.outputs.version
        run: |
          npm install
          npm run generate-icons
          npm run build

      # Публикуем до push: если публикация упадёт, в репозиторий ничего не попадёт и следующий запуск повторит попытку.
      - name: Publish
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        # Пре-релизы (3.75.2-beta.0) уходят под тег beta, чтобы не стать latest.
        run: npm publish --access public --tag "$([[ "$VERSION" == *-* ]] && echo beta || echo latest)"

      - name: Commit
        if: steps.check.outputs.icons
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/index.ts
          git commit -m "release: $VERSION"
          git push origin HEAD

      - name: Tag and GitHub release
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
          ICONS: ${{ steps.check.outputs.icons }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          if [ -n "$ICONS" ]; then
            notes="Обновление [@vkontakte/icons](https://github.com/VKCOM/icons/releases) до $ICONS."
          else
            notes=$(git log -1 --format=%B)
          fi
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          gh release create "v$VERSION" $prerelease --title "$VERSION" --notes "$notes

          npm: https://www.npmjs.com/package/vue-vkontakte-icons/v/$VERSION"
