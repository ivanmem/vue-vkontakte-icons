# Следит за выходом новых версий @vkontakte/icons, перегенерирует иконки и публикует библиотеку в npm.
name: Sync @vkontakte/icons

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-icons
  cancel-in-progress: false

permissions:
  contents: write
  # Нужен для npm Trusted Publishing (OIDC) и provenance.
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing требует npm >= 11.5.1, он идёт в комплекте с Node 24.
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Check for a new version
        id: check
        run: |
          current=$(node -p "require('./package.json').devDependencies['@vkontakte/icons']")
          latest=$(npm view @vkontakte/icons version)
          echo "current=$current, latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "Обновлений нет."
            exit 0
          fi
          # Мажорное обновление может ломать API, поэтому его выпускаем вручную.
          if [ "${current%%.*}" != "${latest%%.*}" ]; then
            echo "::error::Вышла мажорная версия @vkontakte/icons ($current -> $latest). Обновите библиотеку вручную."
            exit 1
          fi
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Update and build
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          npm install
          npm install -D -E "@vkontakte/icons@$VERSION"
          # Версия библиотеки повторяет версию иконок. Её нужно поднять до генерации: она попадает в web-types.json.
          npm version "$VERSION" --no-git-tag-version
          npm run generate-icons
          npm run build

      # Публикуем до push: если публикация упадёт, в репозиторий ничего не попадёт и следующий запуск повторит попытку.
      - name: Publish
        if: steps.check.outputs.version
        run: npm publish --access public

      - name: Commit and tag
        if: steps.check.outputs.version
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json src/index.ts volar.d.ts
          git commit -m "release: $VERSION"
          git tag "v$VERSION"
          git push origin HEAD "v$VERSION"
